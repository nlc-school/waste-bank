<!doctype html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>ระบบธนาคารขยะ</title>
    <!-- The default mark, painted before any script runs. app.js swaps the href for the school's own logo once
         it has it (setFavicon) and puts this one back if that logo is removed. -->
    <link rel="icon" id="favicon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='20' fill='%230B7A55'/%3E%3Cpath d='M12 28c0-9 6-15 17-15 0 10-6 16-15 16h-2v-1zM12 28l8-8' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div id="splash" class="splash" role="status" aria-live="polite" aria-label="กำลังโหลด">
        <div class="spbg" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="spcard">
            <div class="spring" aria-hidden="true"></div><img class="spimg" src="assets/img/splash-waste-project.png"
                alt="โครงการจัดการขยะในโรงเรียน" fetchpriority="high">
        </div>
        <div class="spbar" aria-hidden="true"><span></span></div>
        <div class="spsponsor"><small>สนับสนุนโดย</small><img src="assets/img/ckpower-group-logo.png"
                alt="CKPower Group"></div>
    </div>
    <div class="app">
        <header class="topbar">
            <div class="wrap topin">
                <div class="brand"><span class="mark" id="brandmark"><svg aria-hidden="true" width="18" height="18"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 19c0-8 6-14 15-14 0 9-6 15-14 15H5v-1z" />
                            <path d="M5 19l8-8" />
                        </svg></span>
                    <div><b>ระบบธนาคารขยะ</b><small id="schoolside"></small></div>
                </div>
                <nav class="tabs" id="nav" aria-label="เมนูหลัก"></nav>
                <div class="topright">
                    <div class="clock" id="clock"></div>
                    <div class="userbox" id="userbox"></div>
                </div>
            </div>
        </header>
        <main class="wrap main">
            <div id="view"></div>
            <footer class="footer">
                <div class="sponsor"><small>สนับสนุนโดย</small><img src="assets/img/ckpower-group-logo.png"
                        alt="โลโก้ผู้สนับสนุน"></div>
            </footer>
        </main>
        <nav class="bottomnav" id="bnav" aria-label="เมนูหลัก (มือถือ)"></nav>
    </div>
    <div id="toast" class="toast" hidden role="status"></div>
    <!-- The info bubble (App.info): positioned at the icon that was clicked, fixed to the viewport so no card
         can clip it. role="status" because it is the only place the answer appears, so it is also what a
         screen reader is told. -->
    <div id="tip" class="tip" hidden role="status"></div>
    <dialog id="login" class="logindlg" aria-labelledby="lgtitle" oncancel="if(!App.user()||this.dataset.locked)event.preventDefault()">
        <form onsubmit="App.doLogin(event)">
            <div class="lgtop">
                <div class="lgdeco" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><span class="lglogo"
                    id="lglogo"></span>
                <h2 id="lgtitle">ระบบธนาคารขยะ</h2>
                <p><span id="lgschool"></span></p>
            </div>
            <div class="lgbody">
                <h3>เข้าสู่ระบบ</h3><label for="lguser">อีเมล</label>
                <div class="lgfield"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                        <circle cx="12" cy="8" r="4" />
                        <path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" />
                    </svg><input id="lguser" type="email" maxlength="100" required autocomplete="username"></div><label
                    for="lgpass">รหัสผ่าน</label>
                <div class="lgfield"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="11" width="16" height="10" rx="2" />
                        <path d="M8 11V7a4 4 0 0 1 8 0v4" />
                    </svg><input id="lgpass" type="password" autocomplete="current-password">
                </div>
                <!-- Nobody can tell a shared staff-room computer from a teacher's own phone, so the person
                     signing in says which this is. Unticked keeps the session in this browser only; ticked
                     keeps it on the device until a deadline (assets/js/supabase.js). The warning sits here
                     because this is the moment the browser offers to remember the password too, which is the
                     one thing no timeout of ours can undo. -->
                <label class="lgremember" for="lgremember"><input id="lgremember" type="checkbox"><span>จำฉันไว้บนเครื่องนี้</span></label>
                <p class="lgwarn">เครื่องที่ใช้ร่วมกัน: ไม่ควรติ๊ก และไม่ควรให้เบราว์เซอร์จำรหัสผ่าน</p>
                <p class="lgnote" id="lgmsg" role="alert" hidden></p><button
                    class="primary lgbtn">เข้าสู่ระบบ</button>
            </div>
            <div class="lgfoot"><small>สนับสนุนโดย</small><img src="assets/img/ckpower-group-logo.png"
                    alt="CKPower Group">
            </div>
        </form>
    </dialog>
    <!-- One dialog for everything opened from a row: both slips, the price chart, and the explanations that are
         not documents. Those pass a title, which fills the header, and ask for no พิมพ์ button; a slip draws its
         own head inside the body and keeps the button (ui.js detail()). -->
    <dialog id="detail">
        <h2 id="detailtitle" hidden></h2>
        <p id="detailsub" class="muted" hidden></p>
        <div id="detailbody"></div>
        <div class="actions"><button id="detailprint" onclick="window.print()">พิมพ์</button><button class="primary"
                autofocus onclick="document.getElementById('detail').close()">ปิด</button></div>
    </dialog>
    <dialog id="setup" aria-labelledby="setuptitle">
        <h2 id="setuptitle">ตั้งค่าระบบก่อนเริ่มใช้งาน</h2>
        <div id="setupbody"></div>
        <div class="actions"><button class="primary" autofocus
                onclick="document.getElementById('setup').close()">ไปที่หน้าตั้งค่า</button></div>
    </dialog>
    <dialog id="ask" aria-labelledby="asktitle">
        <form method="dialog" onsubmit="return App.askCheck(event)">
            <div class="rvtop"><span class="rvico bad" aria-hidden="true"><svg width="20" height="20"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M12 4l9 16H3l9-16z" />
                        <path d="M12 10v4M12 17.4v.2" />
                    </svg></span>
                <div>
                    <h2 id="asktitle"></h2>
                    <p id="asksub">ย้อนคืนไม่ได้ ใบเดิมยังเก็บไว้ตรวจสอบและขึ้นสถานะยกเลิก</p>
                </div>
            </div>
            <div class="rvbody">
                <div id="askimpact"></div>
                <div><label for="askinput">เหตุผลที่ยกเลิก</label>
                    <div class="reasons" id="askreasons"></div><input id="askinput" required maxlength="200"
                        placeholder="เช่น บันทึกน้ำหนักผิด">
                </div>
                <div class="confirmword" id="askword" hidden></div>
            </div>
            <div class="actions"><button value="cancel" formnovalidate>ไม่ยกเลิก</button><button class="primary danger"
                    value="ok">ยืนยันยกเลิก</button></div>
        </form>
    </dialog>
    <dialog id="edit" aria-labelledby="edtitle">
        <form method="dialog">
            <div class="rvtop"><span class="rvico warn" aria-hidden="true"><svg width="20" height="20"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M4 20h4l10-10-4-4L4 16v4z" />
                        <path d="M14 6l4 4" />
                    </svg></span>
                <div>
                    <h2 id="edtitle"></h2>
                    <p id="edsub"></p>
                </div>
            </div>
            <div class="rvbody" id="edbody"></div>
            <!-- Order: what the row can be turned into, then the button that saves, then the way out. Same three
                 places in every panel's sheet, and all three the same height. -->
            <div class="actions edacts">
                <div class="edfoot" id="edfoot" hidden></div><button class="primary" id="edok"
                    value="ok">บันทึก</button><button value="cancel" id="edcancel" formnovalidate>ยกเลิก</button>
            </div>
        </form>
    </dialog>
    <dialog id="review" aria-labelledby="rvtitle">
        <form method="dialog">
            <div class="rvtop"><span class="rvico" id="rvico" aria-hidden="true"></span>
                <div>
                    <h2 id="rvtitle"></h2>
                    <p id="rvsub"></p>
                </div>
            </div>
            <div class="rvbody" id="rvbody"></div>
            <div class="actions"><button value="cancel" id="rvcancel" formnovalidate>กลับไปแก้</button><button
                    class="primary" id="rvok" value="ok">ยืนยันบันทึก</button></div>
        </form>
    </dialog>
    <script type="module" src="assets/js/main.js"></script>
</body>

</html>
